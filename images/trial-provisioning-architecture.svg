<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#f7f9fb"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#22303f">Trial &amp; Demo Account Automation Platform</text>

  <!-- Salesforce -->
  <rect x="30" y="80" width="170" height="80" rx="10" fill="#ffffff" stroke="#00a1e0" stroke-width="2"/>
  <text x="115" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#22303f">Salesforce</text>
  <text x="115" y="135" text-anchor="middle" font-size="12" fill="#5a6b7b">New Opportunity</text>

  <!-- dbt/Athena -->
  <rect x="30" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#ff694b" stroke-width="2"/>
  <text x="115" y="235" text-anchor="middle" font-size="15" font-weight="600" fill="#22303f">dbt / Athena</text>
  <text x="115" y="255" text-anchor="middle" font-size="12" fill="#5a6b7b">Trial Opportunity Mart</text>

  <path d="M115,160 L115,200" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Airflow DAG -->
  <rect x="250" y="140" width="220" height="140" rx="10" fill="#e8f4fb" stroke="#017cee" stroke-width="2"/>
  <text x="360" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#22303f">cdp-airflow-dag</text>
  <text x="360" y="188" text-anchor="middle" font-size="12" fill="#5a6b7b">trials_provisioning DAG</text>
  <text x="360" y="210" text-anchor="middle" font-size="11" fill="#5a6b7b">Fetch opportunities</text>
  <text x="360" y="228" text-anchor="middle" font-size="11" fill="#5a6b7b">Resolve regional IDs</text>
  <text x="360" y="246" text-anchor="middle" font-size="11" fill="#5a6b7b">DeferrableJobSensor.expand()</text>
  <text x="360" y="264" text-anchor="middle" font-size="10" fill="#8a97a3">poll 30s / timeout 1h</text>

  <path d="M200,240 L250,210" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Job API -->
  <rect x="520" y="140" width="200" height="140" rx="10" fill="#eef7ee" stroke="#2e9e44" stroke-width="2"/>
  <text x="620" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#22303f">cdp-job-api</text>
  <text x="620" y="188" text-anchor="middle" font-size="11" fill="#5a6b7b">(shared, reused)</text>
  <text x="620" y="212" text-anchor="middle" font-size="11" fill="#5a6b7b">Create / track job</text>
  <text x="620" y="230" text-anchor="middle" font-size="11" fill="#5a6b7b">Dispatch to SQS</text>
  <text x="620" y="248" text-anchor="middle" font-size="11" fill="#5a6b7b">Status: CREATED →</text>
  <text x="620" y="264" text-anchor="middle" font-size="11" fill="#5a6b7b">PROCESSING → COMPLETED/FAILED</text>

  <path d="M470,210 L520,210" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQS -->
  <rect x="770" y="160" width="140" height="100" rx="10" fill="#fff7e6" stroke="#e8a020" stroke-width="2"/>
  <text x="840" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#22303f">AWS SQS</text>
  <text x="840" y="222" text-anchor="middle" font-size="11" fill="#5a6b7b">trials-provisoning</text>
  <text x="840" y="238" text-anchor="middle" font-size="11" fill="#5a6b7b">queue</text>

  <path d="M720,210 L770,210" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Worker -->
  <rect x="950" y="120" width="220" height="180" rx="10" fill="#f3ecfb" stroke="#8c52d1" stroke-width="2"/>
  <text x="1060" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#22303f">cdp-trials-provisoning</text>
  <text x="1060" y="168" text-anchor="middle" font-size="11" fill="#5a6b7b">SQS worker</text>
  <text x="1060" y="192" text-anchor="middle" font-size="11" fill="#5a6b7b">SEMrush + Geppetto</text>
  <text x="1060" y="210" text-anchor="middle" font-size="11" fill="#5a6b7b">keyword &amp; persona discovery</text>
  <text x="1060" y="230" text-anchor="middle" font-size="11" fill="#5a6b7b">Dual-pool curation</text>
  <text x="1060" y="250" text-anchor="middle" font-size="11" fill="#5a6b7b">Searchlight provisioning</text>
  <text x="1060" y="270" text-anchor="middle" font-size="11" fill="#5a6b7b">Job status + Slack alert</text>
  <text x="1060" y="288" text-anchor="middle" font-size="10" fill="#8a97a3">(tools/test_pipeline.py = CSV batch mode)</text>

  <path d="M910,210 L950,210" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Conductor account -->
  <rect x="950" y="380" width="220" height="90" rx="10" fill="#ffffff" stroke="#017cee" stroke-width="2"/>
  <text x="1060" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#22303f">Conductor Account</text>
  <text x="1060" y="435" text-anchor="middle" font-size="11" fill="#5a6b7b">Web properties, tracked searches,</text>
  <text x="1060" y="452" text-anchor="middle" font-size="11" fill="#5a6b7b">personas, AI Search tracking</text>

  <path d="M1060,300 L1060,380" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Slack -->
  <rect x="620" y="380" width="200" height="90" rx="10" fill="#ffffff" stroke="#e01e5a" stroke-width="2"/>
  <text x="720" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#22303f">Slack</text>
  <text x="720" y="435" text-anchor="middle" font-size="11" fill="#5a6b7b">Failure alert with</text>
  <text x="720" y="452" text-anchor="middle" font-size="11" fill="#5a6b7b">job error reason</text>

  <path d="M1000,300 L820,380" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- status feedback loop -->
  <path d="M1000,300 C900,340 700,340 620,270" stroke="#8c52d1" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <text x="800" y="345" text-anchor="middle" font-size="10" fill="#8c52d1">job status update</text>

  <text x="600" y="590" text-anchor="middle" font-size="11" fill="#8a97a3">
    Legend: solid = job/data flow · dashed = status / alert feedback
  </text>
</svg>
